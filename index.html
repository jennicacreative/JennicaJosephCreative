<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jennica Joseph Creative</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #d76481;
      --grey: #5a5a5a;
      --grey-light: #9a9a9a;
      --grey-rule: #e2e2e2;
      --white: #ffffff;
      --off-white: #f9f7f8;
    }

    html { height: -webkit-fill-available; }

    body {
      font-family: 'Raleway', sans-serif;
      background: var(--off-white);
      color: var(--grey);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 52px;
      border-bottom: 1px solid var(--grey-rule);
      background: var(--white);
      overflow: visible;
      position: relative;
      z-index: 100;
    }
    .logo-link { display: inline-block; text-decoration: none; line-height: 0; flex-shrink: 0; }
    .logo-link img { height: 96px; width: auto; display: block; }

    nav {
      display: flex;
      align-items: center;
      gap: 48px;
      overflow: visible;
    }
    nav a {
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.24em; text-transform: uppercase;
      text-decoration: none; color: var(--grey);
      position: relative; padding-bottom: 4px;
      transition: color 0.2s;
      white-space: nowrap;
    }
    nav a::after {
      content: ''; position: absolute;
      bottom: 0; left: 0; width: 100%; height: 1px;
      background: var(--pink);
    }
    nav a:hover, nav a.active { color: var(--pink); }

    .nav-instagram {
      text-decoration: none;
      display: flex;
      align-items: center;
      color: var(--pink);
      line-height: 0;
      transition: opacity 0.2s;
      flex-shrink: 0;
    }
    .nav-instagram:hover { opacity: 0.7; }
    .nav-instagram::after { display: none !important; }
    .nav-instagram svg {
      width: 15px; height: 15px; stroke: currentColor; fill: none;
      stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── SHOP DROPDOWN ── */
    .nav-shop {
      position: relative;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .nav-shop-trigger {
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.24em; text-transform: uppercase;
      text-decoration: none; color: var(--grey);
      position: relative; padding-bottom: 4px;
      transition: color 0.2s;
      display: flex; align-items: center; gap: 5px;
      cursor: pointer; background: none; border: none;
      font-family: 'Raleway', sans-serif;
      white-space: nowrap;
    }
    .nav-shop-trigger::after {
      content: ''; position: absolute;
      bottom: 0; left: 0; width: 100%; height: 1px;
      background: var(--pink);
    }
    .nav-shop-trigger:hover { color: var(--pink); }
    .nav-shop-trigger svg {
      width: 8px; height: 8px; stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.2s; flex-shrink: 0;
      margin-bottom: 4px;
    }
    .nav-shop.open .nav-shop-trigger svg,
    .nav-shop:hover .nav-shop-trigger svg { transform: rotate(180deg); }

    .nav-shop-dropdown {
      position: absolute;
      top: calc(100% + 14px);
      right: 0;
      background: var(--white);
      border: 1px solid var(--grey-rule);
      width: 220px;
      opacity: 0; visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
      z-index: 9999;
      box-shadow: 0 8px 24px rgba(0,0,0,0.10);
    }
    .nav-shop.open .nav-shop-dropdown,
    .nav-shop:hover .nav-shop-dropdown {
      opacity: 1; visibility: visible;
      transform: translateY(0);
    }
    .nav-shop-dropdown a {
      display: block;
      padding: 14px 18px;
      font-size: 0.65rem; font-weight: 400;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--grey); text-decoration: none;
      transition: color 0.15s, background 0.15s;
      white-space: normal;
      line-height: 1.6;
    }
    .nav-shop-dropdown a::after { display: none !important; }
    .nav-shop-dropdown a:hover { color: var(--pink); background: var(--off-white); }

    /* ── FLIPBOOK SECTION ── */
    .flipbook-section {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 52px 40px 60px;
      background: var(--off-white);
      min-height: calc(100vh - 137px);
      min-height: calc(100dvh - 137px);
    }

    .book-wrapper {
      width: min(1200px, 94vw);
      display: flex; flex-direction: column; align-items: center;
    }

    /* ── SPREAD ── */
    .spread {
      width: 100%;
      display: flex;
      position: relative;
      background: var(--white);
      box-shadow: 0 12px 48px rgba(0,0,0,0.13);
      perspective: 2400px;
      overflow: hidden;
    }

    .spread-page {
      width: 50%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: var(--white);
    }
    .spread-page img { width: 100%; height: 100%; object-fit: contain; display: block; }

    /* ── TURNING LEAF ── */
    .turning-leaf {
      position: absolute; top: 0; bottom: 0;
      width: 50%;
      transform-style: preserve-3d;
      z-index: 5; visibility: hidden;
    }
    .turning-leaf { left: 50%; transform-origin: left center; }
    .turning-leaf.left-leaf { left: 0; transform-origin: right center; }

    .leaf-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: var(--white);
    }
    .leaf-face img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .leaf-back { transform: rotateY(180deg); }

    .leaf-front::after {
      content: ''; position: absolute; inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.55) 50%, transparent 70%);
      opacity: 0; transform: translateX(-100%);
    }
    .leaf-front::before {
      content: ''; position: absolute; top: 0; bottom: 0;
      width: 14px; pointer-events: none;
      background: linear-gradient(to right, rgba(0,0,0,0.18), transparent);
      opacity: 0; right: 0;
    }
    .leaf-back::after {
      content: ''; position: absolute; inset: 0;
      pointer-events: none;
      background: linear-gradient(to right, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.06) 45%, transparent 100%);
      opacity: 0;
    }

    @keyframes peelForward  { from { transform: rotateY(0deg); } to { transform: rotateY(-180deg); } }
    @keyframes peelBackward { from { transform: rotateY(0deg); } to { transform: rotateY(180deg); } }

    @keyframes sheenForward {
      0%   { opacity: 0; transform: translateX(-100%); }
      25%  { opacity: 1; transform: translateX(-20%); }
      60%  { opacity: 0.7; transform: translateX(40%); }
      100% { opacity: 0; transform: translateX(150%); }
    }
    @keyframes edgeForward {
      0%   { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 0.6; } 100% { opacity: 0; }
    }
    @keyframes backShadowForward {
      0% { opacity: 0; } 50% { opacity: 0; } 65% { opacity: 1; } 100% { opacity: 0.4; }
    }
    @keyframes sheenBackward {
      0%   { opacity: 0; transform: translateX(150%); }
      25%  { opacity: 1; transform: translateX(40%); }
      60%  { opacity: 0.7; transform: translateX(-20%); }
      100% { opacity: 0; transform: translateX(-100%); }
    }
    @keyframes edgeBackward {
      0%   { opacity: 0; right: auto; left: 0; background: linear-gradient(to left, rgba(0,0,0,0.18), transparent); }
      15%  { opacity: 1; } 70% { opacity: 0.6; } 100% { opacity: 0; }
    }
    @keyframes backShadowBackward {
      0% { opacity: 0; } 50% { opacity: 0; } 65% { opacity: 1; } 100% { opacity: 0.4; }
    }

    .turning-leaf.anim-forward { animation: peelForward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }
    .turning-leaf.anim-forward .leaf-front::after { animation: sheenForward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }
    .turning-leaf.anim-forward .leaf-front::before { animation: edgeForward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }
    .turning-leaf.anim-forward .leaf-back::after { animation: backShadowForward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }

    .turning-leaf.anim-backward { animation: peelBackward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }
    .turning-leaf.anim-backward .leaf-front::after { animation: sheenBackward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }
    .turning-leaf.anim-backward .leaf-front::before { opacity: 0; }
    .turning-leaf.anim-backward .leaf-back::after { animation: backShadowBackward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }

    .spine {
      position: absolute; left: 50%; top: 0;
      transform: translateX(-50%);
      width: 4px; height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.10), rgba(255,255,255,0.5), rgba(0,0,0,0.07));
      z-index: 10; pointer-events: none;
    }

    /* ── Shop Now overlay ── */
    .page-hotspot {
      position: absolute; z-index: 6;
      pointer-events: none; opacity: 0;
      transition: opacity 0.3s;
    }
    .page-hotspot.visible { pointer-events: auto; opacity: 1; }
    #shopBtn { top: 6%; left: 2%; }

    .shop-now-btn {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--pink); color: #fff;
      font-family: 'Raleway', sans-serif;
      font-size: clamp(0.48rem, 1vw, 0.68rem);
      font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
      text-decoration: none;
      padding: 0.55em 1.1em;
      box-shadow: 0 3px 14px rgba(215,100,129,0.38);
      transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
      white-space: nowrap;
    }
    .shop-now-btn:hover {
      background: #c25470;
      box-shadow: 0 5px 20px rgba(215,100,129,0.52);
      transform: translateY(-1px);
    }

    /* ── CONTROLS ── */
    .flipbook-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 28px; margin-top: 36px;
    }
    .flip-btn {
      background: none; border: 1px solid var(--pink);
      color: var(--pink); font-family: 'Raleway', sans-serif;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      padding: 10px 28px; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .flip-btn:hover:not(:disabled) { background: var(--pink); color: var(--white); }
    .flip-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .page-counter {
      font-size: 0.82rem; font-weight: 300;
      color: var(--grey-light); min-width: 100px;
      text-align: center; letter-spacing: 0.12em;
    }

    /* ── PAGE JUMP ── */
    .page-jump {
      display: flex; flex-direction: column; align-items: center;
      gap: 5px; margin-top: 10px; opacity: 0.65; transition: opacity 0.2s;
    }
    .page-jump:hover, .page-jump:focus-within { opacity: 1; }
    .page-jump-row { display: flex; align-items: center; gap: 6px; }
    .page-jump label {
      font-size: 0.48rem; font-weight: 400;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--grey-light);
    }
    .page-jump input {
      font-family: 'Raleway', sans-serif; font-size: 0.65rem; font-weight: 300;
      color: var(--grey); border: 1px solid var(--grey-rule);
      background: var(--white); padding: 3px 6px; width: 42px;
      text-align: center; outline: none; transition: border-color 0.2s;
    }
    .page-jump input:focus { border-color: var(--pink); }
    .page-jump input::-webkit-inner-spin-button,
    .page-jump input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .page-jump input[type=number] { -moz-appearance: textfield; }
    .page-jump button {
      background: none; border: 1px solid var(--pink); color: var(--pink);
      font-family: 'Raleway', sans-serif; font-size: 0.48rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      padding: 4px 10px; cursor: pointer; transition: background 0.2s, color 0.2s;
    }
    .page-jump button:hover { background: var(--pink); color: var(--white); }
    .page-jump-error {
      font-size: 0.58rem; color: var(--pink); letter-spacing: 0.1em;
      margin-top: 4px; min-height: 1em; text-align: center;
    }

    /* ── Shop Now button — smaller on mobile ── */
    @media (max-width: 640px) {
      .shop-now-btn {
        font-size: 0.18rem;
        letter-spacing: 0.04em;
        padding: 0.18em 0.28em;
        gap: 1px;
        box-shadow: 0 1px 4px rgba(215,100,129,0.28);
      }
    }

    /* ── RESPONSIVE NAV ── */
    @media (max-width: 860px) {
      header { padding: 16px 28px; }
      nav { gap: 28px; }
    }

    @media (max-width: 640px) {
      header { padding: 12px 16px; }
      .logo-link img { height: 60px; }
      nav { gap: 16px; flex-wrap: nowrap; }
      nav a { font-size: 0.60rem; letter-spacing: 0.14em; }
      .nav-shop-trigger { font-size: 0.60rem; letter-spacing: 0.14em; }
      .nav-shop-dropdown {
        position: fixed;
        right: 12px;
        width: 200px;
        transform: none;
      }
      .nav-shop.open .nav-shop-dropdown { transform: none; }
    }

    @media (max-width: 380px) {
      nav { gap: 10px; }
      nav a { font-size: 0.54rem; letter-spacing: 0.10em; }
      .nav-shop-trigger { font-size: 0.54rem; letter-spacing: 0.10em; }
    }

    /* ══════════════════════════════════════════
       PORTRAIT MOBILE  ≤ 640px
    ══════════════════════════════════════════ */
    @media (max-width: 640px) and (orientation: portrait) {
      .page-jump, .page-jump-error { display: none; }
      .flipbook-section { padding: 12px 6px 24px; }
      .book-wrapper { width: 100%; }
      .flipbook-controls { gap: 12px; margin-top: 16px; }
      .flip-btn {
        padding: 0; width: 32px; height: 32px; border-radius: 50%;
        font-size: 0; letter-spacing: 0;
        display: flex; align-items: center; justify-content: center;
      }
      #prevBtn::before {
        content: ''; display: block; width: 8px; height: 8px;
        border-left: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg) translateX(1px);
      }
      #nextBtn::after {
        content: ''; display: block; width: 8px; height: 8px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg) translateX(-1px);
      }
      .page-counter { font-size: 0.7rem; min-width: 80px; }
      .page-jump { margin-top: 8px; }
    }

    /* ══════════════════════════════════════════
       LANDSCAPE FULLSCREEN VIEWER
    ══════════════════════════════════════════ */
    body.landscape-active > header,
    body.landscape-active > .flipbook-section { display: none; }

    #landscape-viewer {
      display: none; position: fixed; inset: 0;
      background: #111; z-index: 9000;
      align-items: stretch; justify-content: stretch;
    }
    body.landscape-active #landscape-viewer { display: flex; }

    #landscape-spread {
      position: relative;
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      display: flex;
      perspective: 2400px;
      overflow: hidden;
    }

    .ls-page {
      width: 50%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #fff;
    }
    .ls-page img { width: 100%; height: 100%; object-fit: contain; display: block; }

    .ls-turning-leaf {
      position: absolute; top: 0; bottom: 0;
      width: 50%;
      transform-style: preserve-3d;
      z-index: 5; visibility: hidden;
    }
    .ls-turning-leaf { left: 50%; transform-origin: left center; }
    .ls-turning-leaf.left-leaf { left: 0; transform-origin: right center; }

    .ls-leaf-face {
      position: absolute; inset: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #fff;
    }
    .ls-leaf-face img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .ls-leaf-back { transform: rotateY(180deg); }

    .ls-leaf-front::after {
      content: ''; position: absolute; inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.55) 50%, transparent 70%);
      opacity: 0; transform: translateX(-100%);
    }
    .ls-leaf-front::before {
      content: ''; position: absolute; top: 0; bottom: 0;
      width: 14px; right: 0; pointer-events: none;
      background: linear-gradient(to right, rgba(0,0,0,0.18), transparent);
      opacity: 0;
    }
    .ls-leaf-back::after {
      content: ''; position: absolute; inset: 0;
      pointer-events: none;
      background: linear-gradient(to right, rgba(0,0,0,0.22) 0%, rgba(0,0,0,0.06) 45%, transparent 100%);
      opacity: 0;
    }

    .ls-turning-leaf.anim-forward { animation: peelForward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }
    .ls-turning-leaf.anim-forward .ls-leaf-front::after { animation: sheenForward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }
    .ls-turning-leaf.anim-forward .ls-leaf-front::before { animation: edgeForward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }
    .ls-turning-leaf.anim-forward .ls-leaf-back::after { animation: backShadowForward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }
    .ls-turning-leaf.anim-backward { animation: peelBackward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }
    .ls-turning-leaf.anim-backward .ls-leaf-front::after { animation: sheenBackward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }
    .ls-turning-leaf.anim-backward .ls-leaf-front::before { opacity: 0; }
    .ls-turning-leaf.anim-backward .ls-leaf-back::after { animation: backShadowBackward 0.65s cubic-bezier(0.645,0.045,0.355,1) forwards; }

    #ls-shopBtn { top: 6%; left: 2%; }

    #landscape-spine {
      position: absolute; left: 50%; top: 0;
      transform: translateX(-50%);
      width: 3px; height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.18), rgba(255,255,255,0.55), rgba(0,0,0,0.12));
      z-index: 10; pointer-events: none;
    }

    .ls-btn {
      position: fixed; top: 50%; transform: translateY(-50%);
      z-index: 9100; display: none;
      width: 44px; height: 72px;
      align-items: center; justify-content: center;
      cursor: pointer; border: none; background: transparent;
      color: rgba(255,255,255,0.55);
      transition: color 0.25s, opacity 0.35s; padding: 0;
    }
    body.landscape-active .ls-btn { display: flex; }
    .ls-btn.hidden { opacity: 0; pointer-events: none; }
    .ls-btn:disabled { opacity: 0.12 !important; cursor: not-allowed; }
    .ls-btn:hover:not(:disabled) { color: rgba(255,255,255,0.95); }
    #ls-prevBtn { left: 0; }
    #ls-nextBtn { right: 0; }
    .ls-btn svg {
      width: 18px; height: 28px; stroke: currentColor; fill: none;
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.5));
    }

    #ls-counter {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 9100; display: none;
      font-family: 'Raleway', sans-serif; font-size: 0.55rem;
      font-weight: 300; letter-spacing: 0.18em;
      color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      padding: 4px 12px; border-radius: 20px;
      white-space: nowrap; transition: opacity 0.35s;
    }
    body.landscape-active #ls-counter { display: block; }
    #ls-counter.hidden { opacity: 0; }

    #ls-tap-hint {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      z-index: 9050; display: none;
      font-family: 'Raleway', sans-serif; font-size: 0.42rem;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); pointer-events: none;
      transition: opacity 0.5s; white-space: nowrap;
    }
    body.landscape-active #ls-tap-hint { display: block; }
    #ls-tap-hint.hidden { opacity: 0; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-link" aria-label="Jennica Joseph Creative — Home">
      <img src="Logo.svg" alt="Jennica Joseph Creative" />
    </a>
    <nav>
      <a href="bio.html">Bio</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html">Contact</a>
      <div class="nav-shop" id="navShop">
        <button class="nav-shop-trigger" id="shopTrigger" aria-haspopup="true" aria-expanded="false">
          Shop
          <svg viewBox="0 0 10 6"><polyline points="1,1 5,5 9,1"/></svg>
        </button>
        <div class="nav-shop-dropdown" id="shopDropdown" role="menu">
          <a href="http://www.redbubble.com/people/jennicajoseph" target="_blank" rel="noopener noreferrer" role="menuitem">
            Shop My Designs<br>on Redbubble
          </a>
        </div>
      </div>
      <a href="https://www.instagram.com/jennicajosephcreative" target="_blank" rel="noopener noreferrer" class="nav-instagram" aria-label="Instagram">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </nav>
  </header>

  <section class="flipbook-section">
    <div class="book-wrapper">
      <div class="spread" id="spread">
        <div class="spread-page"><img id="imgLeft"  src="" alt="" /></div>
        <div class="spread-page"><img id="imgRight" src="" alt="" /></div>

        <div class="turning-leaf" id="turningLeaf">
          <div class="leaf-face leaf-front"><img id="leafFrontImg" src="" alt="" /></div>
          <div class="leaf-face leaf-back"><img  id="leafBackImg"  src="" alt="" /></div>
        </div>

        <div class="spine"></div>

        <div class="page-hotspot" id="shopBtn">
          <a class="shop-now-btn" href="http://www.redbubble.com/people/jennicajoseph" target="_blank" rel="noopener noreferrer">Shop Now</a>
        </div>
      </div>

      <div class="flipbook-controls">
        <button class="flip-btn" id="prevBtn">← Prev</button>
        <span class="page-counter" id="pageCounter"></span>
        <button class="flip-btn" id="nextBtn">Next →</button>
      </div>

      <div class="page-jump">
        <label for="pageJumpInput">Go to page</label>
        <div class="page-jump-row">
          <input type="number" id="pageJumpInput" min="1" max="42" placeholder="—" aria-label="Enter page number" />
          <button id="pageJumpBtn">Go</button>
        </div>
      </div>
      <div class="page-jump-error" id="pageJumpError" aria-live="polite"></div>
    </div>
  </section>

  <!-- Landscape fullscreen viewer -->
  <div id="landscape-viewer">
    <div id="landscape-spread">
      <div class="ls-page"><img id="ls-imgLeft"  src="" alt="" /></div>
      <div class="ls-page"><img id="ls-imgRight" src="" alt="" /></div>

      <div class="ls-turning-leaf" id="ls-turningLeaf">
        <div class="ls-leaf-face ls-leaf-front"><img id="ls-leafFrontImg" src="" alt="" /></div>
        <div class="ls-leaf-face ls-leaf-back"><img  id="ls-leafBackImg"  src="" alt="" /></div>
      </div>

      <div id="landscape-spine"></div>

      <div class="page-hotspot" id="ls-shopBtn">
        <a class="shop-now-btn" href="http://www.redbubble.com/people/jennicajoseph" target="_blank" rel="noopener noreferrer">Shop Now</a>
      </div>
    </div>
  </div>

  <button class="ls-btn" id="ls-prevBtn" aria-label="Previous">
    <svg viewBox="0 0 18 28"><polyline points="13,2 4,14 13,26"/></svg>
  </button>
  <span id="ls-counter"></span>
  <button class="ls-btn" id="ls-nextBtn" aria-label="Next">
    <svg viewBox="0 0 18 28"><polyline points="5,2 14,14 5,26"/></svg>
  </button>
  <div id="ls-tap-hint">swipe or tap edges to turn &nbsp;·&nbsp; tap center for controls</div>

  <script>
    /* ── FLIPBOOK DATA ── */
    const PAGES = [
      'images/Page1.jpg','images/Page2.jpg','images/Page3.jpg','images/Page4.jpg',
      'images/Page5.jpg','images/Page6.jpg','images/Page7.jpg','images/Page8.jpg',
      'images/Page9.jpg','images/Page10.jpg','images/Page11.jpg','images/Page12.jpg',
      'images/Page13.jpg','images/Page14.jpg','images/Page15.jpg','images/Page16.jpg',
      'images/Page17.jpg','images/Page18.jpg','images/Page19.jpg','images/Page20.jpg',
      'images/Page21.jpg','images/Page22.jpg','images/Page23.jpg','images/Page24.jpg',
      'images/Page25.jpg','images/Page26.jpg','images/Page27.jpg','images/Page28.jpg',
      'images/Page29.jpg','images/Page30.jpg','images/Page31.jpg','images/Page32.jpg',
      'images/Page33.jpg','images/Page34.jpg','images/Page35.jpg','images/Page36.jpg',
      'images/Page37.jpg','images/Page38.jpg','images/Page39.jpg','images/Page40.jpg',
      'images/Page41.jpg','images/Page42.jpg',
    ];

    const spreads = [];
    for (let i = 0; i < PAGES.length; i += 2) spreads.push([PAGES[i], PAGES[i+1] || null]);
    const totalSpreads = spreads.length;
    const SHOP_SPREAD  = 15;

    let current   = 0;
    let animating = false;
    const FLIP_MS = 650;

    const imgLeft      = document.getElementById('imgLeft');
    const imgRight     = document.getElementById('imgRight');
    const turningLeaf  = document.getElementById('turningLeaf');
    const leafFrontImg = document.getElementById('leafFrontImg');
    const leafBackImg  = document.getElementById('leafBackImg');
    const prevBtn      = document.getElementById('prevBtn');
    const nextBtn      = document.getElementById('nextBtn');
    const counter      = document.getElementById('pageCounter');
    const jumpInput    = document.getElementById('pageJumpInput');
    const jumpBtn      = document.getElementById('pageJumpBtn');
    const jumpError    = document.getElementById('pageJumpError');
    const shopBtnEl    = document.getElementById('shopBtn');

    const lsImgLeft      = document.getElementById('ls-imgLeft');
    const lsImgRight     = document.getElementById('ls-imgRight');
    const lsTurningLeaf  = document.getElementById('ls-turningLeaf');
    const lsLeafFrontImg = document.getElementById('ls-leafFrontImg');
    const lsLeafBackImg  = document.getElementById('ls-leafBackImg');
    const lsPrevBtn      = document.getElementById('ls-prevBtn');
    const lsNextBtn      = document.getElementById('ls-nextBtn');
    const lsCounter      = document.getElementById('ls-counter');
    const lsViewer       = document.getElementById('landscape-viewer');
    const lsTapHint      = document.getElementById('ls-tap-hint');
    const lsShopBtn      = document.getElementById('ls-shopBtn');

    function isLandscapeMobile() {
      const vvh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const vvw = window.visualViewport ? window.visualViewport.width  : window.innerWidth;
      return vvh <= 600 && vvw > vvh;
    }

    const preloadCache = new Set();
    function preloadAdjacent(index) {
      [-1, 1].forEach(offset => {
        const adj = index + offset;
        if (adj < 0 || adj >= totalSpreads) return;
        spreads[adj].forEach(src => {
          if (src && !preloadCache.has(src)) {
            preloadCache.add(src);
            const img = new Image(); img.src = src;
          }
        });
      });
    }

    function showSpread(index) {
      const [l, r] = spreads[index];
      imgLeft.src  = l || '';
      imgRight.src = r || '';
      imgRight.style.visibility = r ? 'visible' : 'hidden';
      lsImgLeft.src  = l || '';
      lsImgRight.src = r || '';
      lsImgRight.style.visibility = r ? 'visible' : 'hidden';

      const lp = index * 2 + 1;
      const rp = Math.min(index * 2 + 2, PAGES.length);
      const label = lp + ' \u2013 ' + rp + ' / ' + PAGES.length;
      counter.textContent   = label;
      lsCounter.textContent = label;

      prevBtn.disabled   = index === 0;
      nextBtn.disabled   = index === totalSpreads - 1;
      lsPrevBtn.disabled = index === 0;
      lsNextBtn.disabled = index === totalSpreads - 1;

      const onShopPage = index === SHOP_SPREAD;
      shopBtnEl.classList.toggle('visible', onShopPage);
      lsShopBtn.classList.toggle('visible', onShopPage);

      preloadAdjacent(index);
    }

    function startFlipAnimation(direction, next, frontSrc, backSrc) {
      const [nxtL, nxtR] = spreads[next];

      if (direction === 'forward') {
        turningLeaf.classList.remove('left-leaf', 'anim-forward', 'anim-backward');
        lsTurningLeaf.classList.remove('left-leaf', 'anim-forward', 'anim-backward');
      } else {
        turningLeaf.classList.add('left-leaf');
        lsTurningLeaf.classList.add('left-leaf');
        turningLeaf.classList.remove('anim-forward', 'anim-backward');
        lsTurningLeaf.classList.remove('anim-forward', 'anim-backward');
      }

      leafFrontImg.src   = frontSrc;
      leafBackImg.src    = backSrc;
      lsLeafFrontImg.src = frontSrc;
      lsLeafBackImg.src  = backSrc;

      turningLeaf.style.visibility   = 'visible';
      lsTurningLeaf.style.visibility = 'visible';
      turningLeaf.offsetWidth;
      lsTurningLeaf.offsetWidth;

      const animCls = direction === 'forward' ? 'anim-forward' : 'anim-backward';
      turningLeaf.classList.add(animCls);
      lsTurningLeaf.classList.add(animCls);

      setTimeout(() => {
        current = next;
        showSpread(current);
      }, FLIP_MS / 2);

      setTimeout(() => {
        turningLeaf.style.visibility   = 'hidden';
        lsTurningLeaf.style.visibility = 'hidden';
        turningLeaf.classList.remove('anim-forward', 'anim-backward', 'left-leaf');
        lsTurningLeaf.classList.remove('anim-forward', 'anim-backward', 'left-leaf');
        animating = false;
      }, FLIP_MS + 40);
    }

    function flip(direction) {
      if (animating) return;
      if (direction === 'forward'  && current >= totalSpreads - 1) return;
      if (direction === 'backward' && current <= 0) return;

      animating = true;
      const next = direction === 'forward' ? current + 1 : current - 1;
      const [curL, curR] = spreads[current];
      const [nxtL, nxtR] = spreads[next];

      shopBtnEl.classList.remove('visible');
      lsShopBtn.classList.remove('visible');

      const frontSrc = direction === 'forward' ? (curR || '') : (curL || '');
      const backSrc  = direction === 'forward' ? (nxtL || '') : (nxtR || '');

      if (!backSrc) {
        startFlipAnimation(direction, next, frontSrc, backSrc);
        return;
      }

      const probe = new Image();
      const safety = setTimeout(() => {
        probe.onload = probe.onerror = null;
        startFlipAnimation(direction, next, frontSrc, backSrc);
      }, 400);

      probe.onload = probe.onerror = () => {
        clearTimeout(safety);
        startFlipAnimation(direction, next, frontSrc, backSrc);
      };
      probe.src = backSrc;
    }

    function jumpToPage(inputEl, errorEl) {
      const raw = parseInt(inputEl.value, 10);
      if (errorEl) errorEl.textContent = '';
      if (isNaN(raw) || raw < 1 || raw > PAGES.length) {
        if (errorEl) errorEl.textContent = 'Enter 1\u2013' + PAGES.length + '.';
        return;
      }
      const targetSpread = Math.floor((raw - 1) / 2);
      if (targetSpread === current) { inputEl.value = ''; return; }
      if (animating) return;
      const dir = targetSpread > current ? 'forward' : 'backward';
      current = targetSpread - (dir === 'forward' ? 1 : -1);
      showSpread(current);
      setTimeout(() => flip(dir), 10);
      inputEl.value = '';
    }

    let hideTimer = null;
    function lsEls() { return [lsPrevBtn, lsNextBtn, lsCounter]; }
    function showControls() {
      lsEls().forEach(el => el.classList.remove('hidden'));
      lsTapHint.classList.add('hidden');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideControls, 3000);
    }
    function hideControls() {
      lsEls().forEach(el => el.classList.add('hidden'));
      lsTapHint.classList.remove('hidden');
    }

    const SWIPE_THRESHOLD = 40;
    let touchStartX = null, touchStartY = null, didSwipe = false;

    lsViewer.addEventListener('touchstart', (e) => {
      if (e.target === lsPrevBtn || e.target === lsNextBtn) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      didSwipe = false;
    }, { passive: true });

    lsViewer.addEventListener('touchmove', (e) => {
      if (touchStartX === null) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;
      if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) didSwipe = true;
    }, { passive: true });

    lsViewer.addEventListener('touchend', (e) => {
      if (e.target === lsPrevBtn || e.target === lsNextBtn) return;
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      touchStartX = touchStartY = null;
      if (didSwipe && Math.abs(dx) > Math.abs(dy)) {
        didSwipe = false; showControls();
        if (dx < 0) flip('forward'); else flip('backward');
        return;
      }
      didSwipe = false;
      const zone = e.changedTouches[0].clientX / window.innerWidth;
      if (zone < 0.3)      { showControls(); flip('backward'); }
      else if (zone > 0.7) { showControls(); flip('forward');  }
      else {
        if (lsCounter.classList.contains('hidden')) showControls();
        else hideControls();
      }
    }, { passive: true });

    function applyLayout() {
      if (isLandscapeMobile()) {
        document.body.classList.add('landscape-active');
        showControls();
      } else {
        document.body.classList.remove('landscape-active');
        clearTimeout(hideTimer);
        lsEls().forEach(el => el.classList.remove('hidden'));
        lsTapHint.classList.remove('hidden');
      }
    }

    prevBtn.addEventListener('click', () => flip('backward'));
    nextBtn.addEventListener('click', () => flip('forward'));
    jumpBtn.addEventListener('click', () => jumpToPage(jumpInput, jumpError));
    jumpInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') jumpToPage(jumpInput, jumpError); });

    lsPrevBtn.addEventListener('click', () => { showControls(); flip('backward'); });
    lsNextBtn.addEventListener('click', () => { showControls(); flip('forward');  });

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === jumpInput) return;
      if (e.key === 'ArrowRight') flip('forward');
      if (e.key === 'ArrowLeft')  flip('backward');
    });

    window.addEventListener('resize', applyLayout);
    window.addEventListener('orientationchange', () => setTimeout(applyLayout, 150));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', applyLayout);

    showSpread(0);
    applyLayout();

    /* ── NAV SHOP DROPDOWN ── */
    const shopTrigger  = document.getElementById('shopTrigger');
    const shopDropdown = document.getElementById('shopDropdown');
    const navShop      = document.getElementById('navShop');

    shopTrigger.addEventListener('click', (e) => {
      e.stopPropagation();
      const isOpen = navShop.classList.toggle('open');
      shopTrigger.setAttribute('aria-expanded', isOpen);
      if (isOpen && window.innerWidth <= 640) {
        const rect = shopTrigger.getBoundingClientRect();
        shopDropdown.style.top = (rect.bottom + 10) + 'px';
      }
    });

    document.addEventListener('click', (e) => {
      if (!navShop.contains(e.target)) {
        navShop.classList.remove('open');
        shopTrigger.setAttribute('aria-expanded', 'false');
      }
    });

    navShop.addEventListener('mouseenter', () => {
      if (window.innerWidth > 640) {
        navShop.classList.add('open');
        shopTrigger.setAttribute('aria-expanded', 'true');
      }
    });
    navShop.addEventListener('mouseleave', () => {
      if (window.innerWidth > 640) {
        navShop.classList.remove('open');
        shopTrigger.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body>
</html>
