<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jennica Joseph Creative</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #d76481;
      --grey: #5a5a5a;
      --grey-light: #9a9a9a;
      --grey-rule: #e2e2e2;
      --white: #ffffff;
      --off-white: #f9f7f8;
      --flip-duration: 0.65s;
      --flip-ease: cubic-bezier(0.645, 0.045, 0.355, 1.000);
    }

    html { height: -webkit-fill-available; }

    body {
      font-family: 'Raleway', sans-serif;
      background: var(--off-white);
      color: var(--grey);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      min-height: 100dvh;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 52px;
      border-bottom: 1px solid var(--grey-rule);
      background: var(--white);
    }
    .logo-link { display: inline-block; text-decoration: none; line-height: 0; }
    .logo-link img { height: 96px; width: auto; display: block; }

    nav { display: flex; align-items: center; gap: 48px; }
    nav a {
      font-size: 0.72rem; font-weight: 500;
      letter-spacing: 0.24em; text-transform: uppercase;
      text-decoration: none; color: var(--grey);
      position: relative; padding-bottom: 4px;
      transition: color 0.2s;
    }
    nav a::after {
      content: ''; position: absolute;
      bottom: 0; left: 0;
      width: 100%; height: 1px;
      background: var(--pink);
    }
    nav a:hover, nav a.active { color: var(--pink); }

    .nav-instagram {
      text-decoration: none; display: flex; align-items: center;
      color: var(--pink); line-height: 0; transition: opacity 0.2s;
    }
    .nav-instagram:hover { opacity: 0.7; }
    .nav-instagram::after { display: none; }
    .nav-instagram svg {
      width: 15px; height: 15px;
      stroke: currentColor; fill: none;
      stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    }

    /* ── FLIPBOOK SECTION ── */
    .flipbook-section {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 52px 40px 60px;
      background: var(--off-white);
      min-height: calc(100vh - 137px);
      min-height: calc(100dvh - 137px);
    }

    .book-wrapper {
      width: min(1200px, 94vw);
      display: flex; flex-direction: column; align-items: center;
    }

    /* ════════════════════════════════════════
       BOOK STAGE — the real page-turn engine
       ════════════════════════════════════════
       Structure:
         .spread
           .book-stage          ← clipping + perspective
             .page-layer.back   ← spread that stays (behind)
             .page-layer.front  ← spread visible when leaf is closed
             .turning-leaf      ← the half that actually rotates
               .leaf-front      ← what you see before the fold
               .leaf-back       ← what you see after the fold (mirrored)
             .shadow-overlay    ← gradient that sweeps across during turn
           .spine
    ════════════════════════════════════════ */

    .spread {
      width: 100%;
      position: relative;
      box-shadow: 0 12px 48px rgba(0,0,0,0.13);
    }

    /* aspect ratio keeps spread proportional; adjust if your pages differ */
    .spread::before {
      content: '';
      display: block;
      /* 2 pages side-by-side, each ~0.707 tall → combined ~1.414 : 2 = 0.707 */
      padding-top: 70.7%;
    }

    .book-stage {
      position: absolute;
      inset: 0;
      perspective: 2800px;
      overflow: hidden;
      background: var(--white);
    }

    /* ── Static layers ── */
    .page-layer {
      position: absolute; inset: 0;
      display: flex; width: 100%; height: 100%;
    }
    .page-half {
      width: 50%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: var(--white);
    }
    .page-half img {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }

    /* layer ordering:
       back  (z=0) — the destination spread
       front (z=1) — the source spread
       leaf  (z=2) — the peeling half
       shadow(z=3) — sweep gradient */
    .page-layer.back  { z-index: 0; }
    .page-layer.front { z-index: 1; }

    /* ── Turning leaf ── */
    .turning-leaf {
      position: absolute;
      top: 0;
      width: 50%; height: 100%;
      transform-style: preserve-3d;
      z-index: 2;
      /* pivot at the spine */
      transform-origin: left center;
      /* default: right leaf turns forward */
      left: 50%;
    }
    .turning-leaf.left-leaf {
      left: 0;
      transform-origin: right center;
    }

    .leaf-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      background: var(--white);
    }
    .leaf-face img {
      width: 100%; height: 100%;
      object-fit: contain; display: block;
    }
    .leaf-back {
      transform: rotateY(180deg);
    }
    /* mirror left-leaf faces so they read correctly */
    .turning-leaf.left-leaf .leaf-face img {
      transform: scaleX(-1);
    }

    /* ── Shadow overlay that sweeps during flip ── */
    .shadow-overlay {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 3;
      opacity: 0;
    }

    /* ── Page-curl fold shadow on the leaf itself ── */
    .leaf-fold-shadow {
      position: absolute;
      top: 0; bottom: 0;
      width: 24px;
      pointer-events: none;
      z-index: 4;
    }
    .turning-leaf:not(.left-leaf) .leaf-fold-shadow {
      left: 0;
      background: linear-gradient(to right,
        rgba(0,0,0,0.18) 0%,
        rgba(0,0,0,0.04) 60%,
        transparent 100%);
    }
    .turning-leaf.left-leaf .leaf-fold-shadow {
      right: 0;
      background: linear-gradient(to left,
        rgba(0,0,0,0.18) 0%,
        rgba(0,0,0,0.04) 60%,
        transparent 100%);
    }

    /* ────────────────────────────────────────
       ANIMATIONS
    ──────────────────────────────────────── */

    /* Forward: right leaf peels left (rotateY 0 → -180) */
    .book-stage.flip-forward .turning-leaf:not(.left-leaf) {
      animation: leafPeelForward var(--flip-duration) var(--flip-ease) forwards;
    }
    @keyframes leafPeelForward {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-180deg); }
    }

    /* The shadow sweeps right-to-left on the left half during forward flip */
    .book-stage.flip-forward .shadow-overlay {
      animation: shadowSweepForward var(--flip-duration) var(--flip-ease) forwards;
      background: linear-gradient(to right,
        transparent 0%,
        rgba(0,0,0,0.08) 35%,
        rgba(0,0,0,0.18) 50%,
        rgba(0,0,0,0.08) 65%,
        transparent 100%);
    }
    @keyframes shadowSweepForward {
      0%   { opacity: 0; clip-path: inset(0 50% 0 0); }
      15%  { opacity: 1; clip-path: inset(0 50% 0 0); }
      50%  { opacity: 1; clip-path: inset(0 25% 0 25%); }
      85%  { opacity: 1; clip-path: inset(0 0 0 50%); }
      100% { opacity: 0; clip-path: inset(0 0 0 50%); }
    }

    /* Backward: left leaf peels right (rotateY 0 → 180) */
    .book-stage.flip-backward .turning-leaf.left-leaf {
      animation: leafPeelBackward var(--flip-duration) var(--flip-ease) forwards;
    }
    @keyframes leafPeelBackward {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(180deg); }
    }

    .book-stage.flip-backward .shadow-overlay {
      animation: shadowSweepBackward var(--flip-duration) var(--flip-ease) forwards;
      background: linear-gradient(to left,
        transparent 0%,
        rgba(0,0,0,0.08) 35%,
        rgba(0,0,0,0.18) 50%,
        rgba(0,0,0,0.08) 65%,
        transparent 100%);
    }
    @keyframes shadowSweepBackward {
      0%   { opacity: 0; clip-path: inset(0 0 0 50%); }
      15%  { opacity: 1; clip-path: inset(0 0 0 50%); }
      50%  { opacity: 1; clip-path: inset(0 25% 0 25%); }
      85%  { opacity: 1; clip-path: inset(0 50% 0 0); }
      100% { opacity: 0; clip-path: inset(0 50% 0 0); }
    }

    /* Spine */
    .spine {
      position: absolute; left: 50%; top: 0;
      transform: translateX(-50%);
      width: 4px; height: 100%;
      background: linear-gradient(to right,
        rgba(0,0,0,0.10),
        rgba(255,255,255,0.5),
        rgba(0,0,0,0.07));
      z-index: 10; pointer-events: none;
    }

    /* ── CONTROLS ── */
    .flipbook-controls {
      display: flex; align-items: center; justify-content: center;
      gap: 28px; margin-top: 36px;
    }
    .flip-btn {
      background: none; border: 1px solid var(--pink);
      color: var(--pink); font-family: 'Raleway', sans-serif;
      font-size: 0.65rem; font-weight: 500;
      letter-spacing: 0.22em; text-transform: uppercase;
      padding: 10px 28px; cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .flip-btn:hover:not(:disabled) { background: var(--pink); color: var(--white); }
    .flip-btn:disabled { opacity: 0.25; cursor: not-allowed; }
    .page-counter {
      font-size: 0.82rem; font-weight: 300;
      color: var(--grey-light); min-width: 100px;
      text-align: center; letter-spacing: 0.12em;
    }

    /* ── PAGE JUMP ── */
    .page-jump {
      display: flex; flex-direction: column; align-items: center;
      gap: 5px; margin-top: 10px; opacity: 0.65; transition: opacity 0.2s;
    }
    .page-jump:hover, .page-jump:focus-within { opacity: 1; }
    .page-jump-row { display: flex; align-items: center; gap: 6px; }
    .page-jump label {
      font-size: 0.48rem; font-weight: 400;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--grey-light);
    }
    .page-jump input {
      font-family: 'Raleway', sans-serif; font-size: 0.65rem; font-weight: 300;
      color: var(--grey); border: 1px solid var(--grey-rule);
      background: var(--white); padding: 3px 6px; width: 42px;
      text-align: center; outline: none; transition: border-color 0.2s;
    }
    .page-jump input:focus { border-color: var(--pink); }
    .page-jump input::-webkit-inner-spin-button,
    .page-jump input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .page-jump input[type=number] { -moz-appearance: textfield; }
    .page-jump button {
      background: none; border: 1px solid var(--pink); color: var(--pink);
      font-family: 'Raleway', sans-serif; font-size: 0.48rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      padding: 4px 10px; cursor: pointer; transition: background 0.2s, color 0.2s;
    }
    .page-jump button:hover { background: var(--pink); color: var(--white); }
    .page-jump-error {
      font-size: 0.58rem; color: var(--pink); letter-spacing: 0.1em;
      margin-top: 4px; min-height: 1em; text-align: center;
    }

    /* ══════════════════════════════════════════
       PORTRAIT MOBILE  ≤ 640px
    ══════════════════════════════════════════ */
    @media (max-width: 640px) and (orientation: portrait) {
      header { padding: 10px 16px; }
      .logo-link img { height: 52px; }
      nav { gap: 18px; }
      nav a { font-size: 0.62rem; letter-spacing: 0.18em; }
      .flipbook-section { padding: 12px 6px 24px; }
      .book-wrapper { width: 100%; }
      .flipbook-controls { gap: 12px; margin-top: 16px; }
      .flip-btn {
        padding: 0; width: 32px; height: 32px; border-radius: 50%;
        font-size: 0; letter-spacing: 0;
        display: flex; align-items: center; justify-content: center;
      }
      #prevBtn::before {
        content: ''; display: block;
        width: 8px; height: 8px;
        border-left: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(45deg) translateX(1px);
      }
      #nextBtn::after {
        content: ''; display: block;
        width: 8px; height: 8px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg) translateX(-1px);
      }
      .page-counter { font-size: 0.7rem; min-width: 80px; }
      .page-jump { margin-top: 8px; }
    }

    /* ══════════════════════════════════════════
       LANDSCAPE FULLSCREEN VIEWER
    ══════════════════════════════════════════ */
    body.landscape-active > header,
    body.landscape-active > .flipbook-section { display: none; }

    #landscape-viewer {
      display: none; position: fixed; inset: 0;
      background: #111; z-index: 9000;
      align-items: stretch; justify-content: stretch;
    }
    body.landscape-active #landscape-viewer { display: flex; }

    #landscape-spread {
      position: relative;
      width: 100vw; width: 100dvw;
      height: 100vh; height: 100dvh;
      overflow: hidden;
    }

    /* Landscape book stage mirrors portrait logic */
    #ls-book-stage {
      position: absolute; inset: 0;
      perspective: 2800px;
    }

    .ls-page-layer {
      position: absolute; inset: 0;
      display: flex; width: 100%; height: 100%;
    }
    .ls-page-half {
      width: 50%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #fff;
    }
    .ls-page-half img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .ls-page-layer.back  { z-index: 0; }
    .ls-page-layer.front { z-index: 1; }

    .ls-turning-leaf {
      position: absolute; top: 0;
      width: 50%; height: 100%;
      transform-style: preserve-3d;
      z-index: 2; left: 50%;
      transform-origin: left center;
    }
    .ls-turning-leaf.left-leaf {
      left: 0; transform-origin: right center;
    }
    .ls-leaf-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #fff;
    }
    .ls-leaf-face img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .ls-leaf-back { transform: rotateY(180deg); }
    .ls-turning-leaf.left-leaf .ls-leaf-face img { transform: scaleX(-1); }

    .ls-shadow-overlay {
      position: absolute; inset: 0;
      pointer-events: none; z-index: 3; opacity: 0;
    }
    .ls-leaf-fold-shadow {
      position: absolute; top: 0; bottom: 0;
      width: 24px; pointer-events: none; z-index: 4;
    }
    .ls-turning-leaf:not(.left-leaf) .ls-leaf-fold-shadow {
      left: 0;
      background: linear-gradient(to right,rgba(0,0,0,0.18),rgba(0,0,0,0.04) 60%,transparent);
    }
    .ls-turning-leaf.left-leaf .ls-leaf-fold-shadow {
      right: 0;
      background: linear-gradient(to left,rgba(0,0,0,0.18),rgba(0,0,0,0.04) 60%,transparent);
    }

    /* Reuse same keyframes for landscape */
    #ls-book-stage.flip-forward .ls-turning-leaf:not(.left-leaf) {
      animation: leafPeelForward var(--flip-duration) var(--flip-ease) forwards;
    }
    #ls-book-stage.flip-forward .ls-shadow-overlay {
      animation: shadowSweepForward var(--flip-duration) var(--flip-ease) forwards;
      background: linear-gradient(to right,
        transparent 0%,rgba(0,0,0,0.08) 35%,rgba(0,0,0,0.18) 50%,
        rgba(0,0,0,0.08) 65%,transparent 100%);
    }
    #ls-book-stage.flip-backward .ls-turning-leaf.left-leaf {
      animation: leafPeelBackward var(--flip-duration) var(--flip-ease) forwards;
    }
    #ls-book-stage.flip-backward .ls-shadow-overlay {
      animation: shadowSweepBackward var(--flip-duration) var(--flip-ease) forwards;
      background: linear-gradient(to left,
        transparent 0%,rgba(0,0,0,0.08) 35%,rgba(0,0,0,0.18) 50%,
        rgba(0,0,0,0.08) 65%,transparent 100%);
    }

    #landscape-spine {
      position: absolute; left: 50%; top: 0;
      transform: translateX(-50%);
      width: 3px; height: 100%;
      background: linear-gradient(to right,
        rgba(0,0,0,0.18),rgba(255,255,255,0.55),rgba(0,0,0,0.12));
      z-index: 10; pointer-events: none;
    }

    /* ── Side arrow buttons ── */
    .ls-btn {
      position: fixed; top: 50%; transform: translateY(-50%);
      z-index: 9100; display: none;
      width: 44px; height: 72px;
      align-items: center; justify-content: center;
      cursor: pointer; border: none; background: transparent;
      color: rgba(255,255,255,0.55);
      transition: color 0.25s, opacity 0.35s; padding: 0;
    }
    body.landscape-active .ls-btn { display: flex; }
    .ls-btn.hidden { opacity: 0; pointer-events: none; }
    .ls-btn:disabled { opacity: 0.12 !important; cursor: not-allowed; }
    .ls-btn:hover:not(:disabled) { color: rgba(255,255,255,0.95); }
    #ls-prevBtn { left: 0; }
    #ls-nextBtn { right: 0; }
    .ls-btn svg {
      width: 18px; height: 28px;
      stroke: currentColor; fill: none; stroke-width: 1.5;
      stroke-linecap: round; stroke-linejoin: round;
      filter: drop-shadow(0 0 6px rgba(0,0,0,0.5));
    }

    #ls-counter {
      position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 9100; display: none;
      font-family: 'Raleway', sans-serif; font-size: 0.55rem;
      font-weight: 300; letter-spacing: 0.18em;
      color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.28);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      padding: 4px 12px; border-radius: 20px;
      white-space: nowrap; transition: opacity 0.35s;
    }
    body.landscape-active #ls-counter { display: block; }
    #ls-counter.hidden { opacity: 0; }

    #ls-tap-hint {
      position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
      z-index: 9050; display: none;
      font-family: 'Raleway', sans-serif; font-size: 0.42rem;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.35); pointer-events: none;
      transition: opacity 0.5s; white-space: nowrap;
    }
    body.landscape-active #ls-tap-hint { display: block; }
    #ls-tap-hint.hidden { opacity: 0; }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-link" aria-label="Jennica Joseph Creative — Home">
      <img src="Logo.svg" alt="Jennica Joseph Creative" />
    </a>
    <nav>
      <a href="bio.html">Bio</a>
      <a href="resume.html">Resume</a>
      <a href="contact.html">Contact</a>
      <a href="https://www.instagram.com/jennicajosephcreative" target="_blank" rel="noopener noreferrer" class="nav-instagram" aria-label="Instagram">
        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.5" fill="currentColor" stroke="none"/></svg>
      </a>
    </nav>
  </header>

  <section class="flipbook-section">
    <div class="book-wrapper">
      <div class="spread">
        <div class="book-stage" id="bookStage">
          <!-- Back layer: destination spread (shown when leaf is fully turned) -->
          <div class="page-layer back" id="backLayer">
            <div class="page-half"><img id="backImgLeft"  src="" alt="" /></div>
            <div class="page-half"><img id="backImgRight" src="" alt="" /></div>
          </div>
          <!-- Front layer: current spread (static, visible before/after flip) -->
          <div class="page-layer front" id="frontLayer">
            <div class="page-half"><img id="frontImgLeft"  src="" alt="" /></div>
            <div class="page-half"><img id="frontImgRight" src="" alt="" /></div>
          </div>
          <!-- Turning leaf: the half-page that actually peels -->
          <div class="turning-leaf" id="turningLeaf">
            <div class="leaf-face leaf-front"><img id="leafFrontImg" src="" alt="" /></div>
            <div class="leaf-face leaf-back"><img id="leafBackImg"  src="" alt="" /></div>
            <div class="leaf-fold-shadow"></div>
          </div>
          <!-- Sweep shadow -->
          <div class="shadow-overlay" id="shadowOverlay"></div>
        </div>
        <div class="spine"></div>
      </div>

      <div class="flipbook-controls">
        <button class="flip-btn" id="prevBtn">← Prev</button>
        <span class="page-counter" id="pageCounter"></span>
        <button class="flip-btn" id="nextBtn">Next →</button>
      </div>

      <div class="page-jump">
        <label for="pageJumpInput">Go to page</label>
        <div class="page-jump-row">
          <input type="number" id="pageJumpInput" min="1" max="42" placeholder="—" aria-label="Enter page number" />
          <button id="pageJumpBtn">Go</button>
        </div>
      </div>
      <div class="page-jump-error" id="pageJumpError" aria-live="polite"></div>
    </div>
  </section>

  <!-- Landscape fullscreen viewer -->
  <div id="landscape-viewer">
    <div id="landscape-spread">
      <div id="ls-book-stage">
        <div class="ls-page-layer back" id="ls-backLayer">
          <div class="ls-page-half"><img id="ls-backImgLeft"  src="" alt="" /></div>
          <div class="ls-page-half"><img id="ls-backImgRight" src="" alt="" /></div>
        </div>
        <div class="ls-page-layer front" id="ls-frontLayer">
          <div class="ls-page-half"><img id="ls-frontImgLeft"  src="" alt="" /></div>
          <div class="ls-page-half"><img id="ls-frontImgRight" src="" alt="" /></div>
        </div>
        <div class="ls-turning-leaf" id="ls-turningLeaf">
          <div class="ls-leaf-face ls-leaf-front"><img id="ls-leafFrontImg" src="" alt="" /></div>
          <div class="ls-leaf-face ls-leaf-back"><img id="ls-leafBackImg"  src="" alt="" /></div>
          <div class="ls-leaf-fold-shadow"></div>
        </div>
        <div class="ls-shadow-overlay" id="ls-shadowOverlay"></div>
      </div>
      <div id="landscape-spine"></div>
    </div>
  </div>

  <button class="ls-btn" id="ls-prevBtn" aria-label="Previous">
    <svg viewBox="0 0 18 28"><polyline points="13,2 4,14 13,26"/></svg>
  </button>
  <span id="ls-counter"></span>
  <button class="ls-btn" id="ls-nextBtn" aria-label="Next">
    <svg viewBox="0 0 18 28"><polyline points="5,2 14,14 5,26"/></svg>
  </button>
  <div id="ls-tap-hint">swipe or tap edges to turn &nbsp;·&nbsp; tap center for controls</div>

  <script>
    const PAGES = [
      'images/Page1.jpg','images/Page2.jpg','images/Page3.jpg','images/Page4.jpg',
      'images/Page5.jpg','images/Page6.jpg','images/Page7.jpg','images/Page8.jpg',
      'images/Page9.jpg','images/Page10.jpg','images/Page11.jpg','images/Page12.jpg',
      'images/Page13.jpg','images/Page14.jpg','images/Page15.jpg','images/Page16.jpg',
      'images/Page17.jpg','images/Page18.jpg','images/Page19.jpg','images/Page20.jpg',
      'images/Page21.jpg','images/Page22.jpg','images/Page23.jpg','images/Page24.jpg',
      'images/Page25.jpg','images/Page26.jpg','images/Page27.jpg','images/Page28.jpg',
      'images/Page29.jpg','images/Page30.jpg','images/Page31.jpg','images/Page32.jpg',
      'images/Page33.jpg','images/Page34.jpg','images/Page35.jpg','images/Page36.jpg',
      'images/Page37.jpg','images/Page38.jpg','images/Page39.jpg','images/Page40.jpg',
      'images/Page41.jpg','images/Page42.jpg',
    ];

    const spreads = [];
    for (let i = 0; i < PAGES.length; i += 2)
      spreads.push([PAGES[i], PAGES[i+1] || null]);
    const totalSpreads = spreads.length;

    let current = 0;
    let animating = false;
    const FLIP_MS = 650; // must match --flip-duration

    // ── Portrait DOM refs ──
    const bookStage     = document.getElementById('bookStage');
    const frontImgLeft  = document.getElementById('frontImgLeft');
    const frontImgRight = document.getElementById('frontImgRight');
    const backImgLeft   = document.getElementById('backImgLeft');
    const backImgRight  = document.getElementById('backImgRight');
    const leafFrontImg  = document.getElementById('leafFrontImg');
    const leafBackImg   = document.getElementById('leafBackImg');
    const turningLeaf   = document.getElementById('turningLeaf');
    const prevBtn       = document.getElementById('prevBtn');
    const nextBtn       = document.getElementById('nextBtn');
    const counter       = document.getElementById('pageCounter');
    const jumpInput     = document.getElementById('pageJumpInput');
    const jumpBtn       = document.getElementById('pageJumpBtn');
    const jumpError     = document.getElementById('pageJumpError');

    // ── Landscape DOM refs ──
    const lsStage        = document.getElementById('ls-book-stage');
    const lsFrontImgLeft = document.getElementById('ls-frontImgLeft');
    const lsFrontImgRight= document.getElementById('ls-frontImgRight');
    const lsBackImgLeft  = document.getElementById('ls-backImgLeft');
    const lsBackImgRight = document.getElementById('ls-backImgRight');
    const lsLeafFrontImg = document.getElementById('ls-leafFrontImg');
    const lsLeafBackImg  = document.getElementById('ls-leafBackImg');
    const lsTurningLeaf  = document.getElementById('ls-turningLeaf');
    const lsPrevBtn      = document.getElementById('ls-prevBtn');
    const lsNextBtn      = document.getElementById('ls-nextBtn');
    const lsCounter      = document.getElementById('ls-counter');
    const lsViewer       = document.getElementById('landscape-viewer');
    const lsTapHint      = document.getElementById('ls-tap-hint');

    function isLandscapeMobile() {
      const vvh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      const vvw = window.visualViewport ? window.visualViewport.width  : window.innerWidth;
      return vvh <= 600 && vvw > vvh;
    }

    function imgSrc(idx) {
      return (idx >= 0 && idx < PAGES.length) ? PAGES[idx] : '';
    }

    /** Render current spread into front layers (no animation) */
    function renderStatic(index) {
      const [l, r] = spreads[index];

      frontImgLeft.src  = l || '';
      frontImgRight.src = r || '';
      frontImgRight.style.visibility = r ? 'visible' : 'hidden';

      lsFrontImgLeft.src  = l || '';
      lsFrontImgRight.src = r || '';
      lsFrontImgRight.style.visibility = r ? 'visible' : 'hidden';

      // Back layer blank when static
      backImgLeft.src  = '';
      backImgRight.src = '';
      lsBackImgLeft.src  = '';
      lsBackImgRight.src = '';

      // Leaf hidden
      turningLeaf.style.visibility   = 'hidden';
      lsTurningLeaf.style.visibility = 'hidden';

      const lp = index * 2 + 1;
      const rp = Math.min(index * 2 + 2, PAGES.length);
      const label = lp + ' \u2013 ' + rp + ' / ' + PAGES.length;
      counter.textContent   = label;
      lsCounter.textContent = label;

      prevBtn.disabled   = index === 0;
      nextBtn.disabled   = index === totalSpreads - 1;
      lsPrevBtn.disabled = index === 0;
      lsNextBtn.disabled = index === totalSpreads - 1;
    }

    /**
     * flip(direction)
     *
     * Forward (right leaf peels left):
     *   front = current spread
     *   back  = next spread (seen when leaf is transparent / fully turned)
     *   leaf front face = current right page
     *   leaf back  face = next left page  (mirrored by CSS scaleX)
     *   leaf pivot = left edge (transform-origin: left center, left:50%)
     *   rotateY: 0 → -180
     *
     * Backward (left leaf peels right):
     *   front = current spread
     *   back  = prev spread
     *   leaf front face = current left page
     *   leaf back  face = prev right page (mirrored)
     *   leaf pivot = right edge (left-leaf class)
     *   rotateY: 0 → 180
     */
    function flip(direction) {
      if (animating) return;
      if (direction === 'forward'  && current >= totalSpreads - 1) return;
      if (direction === 'backward' && current <= 0) return;

      animating = true;
      const next = direction === 'forward' ? current + 1 : current - 1;

      const [curL, curR] = spreads[current];
      const [nxtL, nxtR] = spreads[next];

      // ── Portrait setup ──
      // Front = current (already set, but ensure)
      frontImgLeft.src  = curL || '';
      frontImgRight.src = curR || '';
      frontImgRight.style.visibility = curR ? 'visible' : 'hidden';

      // Back = destination spread
      backImgLeft.src  = nxtL || '';
      backImgRight.src = nxtR || '';
      backImgRight.style.visibility = nxtR ? 'visible' : 'hidden';

      // ── Landscape setup (mirrors portrait) ──
      lsFrontImgLeft.src  = curL || '';
      lsFrontImgRight.src = curR || '';
      lsFrontImgRight.style.visibility = curR ? 'visible' : 'hidden';
      lsBackImgLeft.src   = nxtL || '';
      lsBackImgRight.src  = nxtR || '';
      lsBackImgRight.style.visibility = nxtR ? 'visible' : 'hidden';

      // ── Configure leaf ──
      if (direction === 'forward') {
        // Right leaf peels; front face = current right page, back face = next left
        turningLeaf.classList.remove('left-leaf');
        lsTurningLeaf.classList.remove('left-leaf');
        leafFrontImg.src   = curR || '';
        leafBackImg.src    = nxtL || '';
        lsLeafFrontImg.src = curR || '';
        lsLeafBackImg.src  = nxtL || '';
      } else {
        // Left leaf peels; front face = current left page, back face = prev right
        turningLeaf.classList.add('left-leaf');
        lsTurningLeaf.classList.add('left-leaf');
        leafFrontImg.src   = curL || '';
        leafBackImg.src    = nxtR || '';
        lsLeafFrontImg.src = curL || '';
        lsLeafBackImg.src  = nxtR || '';
      }

      turningLeaf.style.visibility   = 'visible';
      lsTurningLeaf.style.visibility = 'visible';

      // ── Trigger animations ──
      const cls = direction === 'forward' ? 'flip-forward' : 'flip-backward';

      // Force reflow so re-triggering same class works
      bookStage.offsetWidth; // eslint-disable-line
      lsStage.offsetWidth;   // eslint-disable-line

      bookStage.classList.add(cls);
      lsStage.classList.add(cls);

      // Halfway: update static front to destination (leaf is edge-on, invisible)
      setTimeout(() => {
        current = next;
        renderStatic(current);
      }, FLIP_MS / 2);

      // Done
      setTimeout(() => {
        bookStage.classList.remove('flip-forward', 'flip-backward');
        lsStage.classList.remove('flip-forward', 'flip-backward');
        animating = false;
      }, FLIP_MS + 40);
    }

    function jumpToPage(inputEl, errorEl) {
      const raw = parseInt(inputEl.value, 10);
      if (errorEl) errorEl.textContent = '';
      if (isNaN(raw) || raw < 1 || raw > PAGES.length) {
        if (errorEl) errorEl.textContent = 'Enter 1\u2013' + PAGES.length + '.';
        return;
      }
      const targetSpread = Math.floor((raw - 1) / 2);
      if (targetSpread === current) { inputEl.value = ''; return; }
      if (animating) return;
      const dir = targetSpread > current ? 'forward' : 'backward';
      // Jump directly (one animated flip regardless of distance)
      current = targetSpread - (dir === 'forward' ? 1 : -1);
      renderStatic(current);
      setTimeout(() => flip(dir), 10);
      inputEl.value = '';
    }

    // ── Landscape controls auto-hide ──
    let hideTimer = null;
    function lsEls() { return [lsPrevBtn, lsNextBtn, lsCounter]; }
    function showControls() {
      lsEls().forEach(el => el.classList.remove('hidden'));
      lsTapHint.classList.add('hidden');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideControls, 3000);
    }
    function hideControls() {
      lsEls().forEach(el => el.classList.add('hidden'));
      lsTapHint.classList.remove('hidden');
    }

    // ── Swipe + zone-tap ──
    const SWIPE_THRESHOLD = 40;
    let touchStartX = null, touchStartY = null, didSwipe = false;

    lsViewer.addEventListener('touchstart', (e) => {
      if (e.target === lsPrevBtn || e.target === lsNextBtn) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      didSwipe = false;
    }, { passive: true });

    lsViewer.addEventListener('touchmove', (e) => {
      if (touchStartX === null) return;
      const dx = e.touches[0].clientX - touchStartX;
      const dy = e.touches[0].clientY - touchStartY;
      if (Math.abs(dx) > SWIPE_THRESHOLD && Math.abs(dx) > Math.abs(dy)) didSwipe = true;
    }, { passive: true });

    lsViewer.addEventListener('touchend', (e) => {
      if (e.target === lsPrevBtn || e.target === lsNextBtn) return;
      if (touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      touchStartX = touchStartY = null;
      if (didSwipe && Math.abs(dx) > Math.abs(dy)) {
        didSwipe = false; showControls();
        if (dx < 0) flip('forward'); else flip('backward');
        return;
      }
      didSwipe = false;
      const zone = e.changedTouches[0].clientX / window.innerWidth;
      if (zone < 0.3)      { showControls(); flip('backward'); }
      else if (zone > 0.7) { showControls(); flip('forward');  }
      else {
        if (lsCounter.classList.contains('hidden')) showControls();
        else hideControls();
      }
    }, { passive: true });

    // ── Layout switch ──
    function applyLayout() {
      if (isLandscapeMobile()) {
        document.body.classList.add('landscape-active');
        showControls();
      } else {
        document.body.classList.remove('landscape-active');
        clearTimeout(hideTimer);
        lsEls().forEach(el => el.classList.remove('hidden'));
        lsTapHint.classList.remove('hidden');
      }
    }

    // ── Wiring ──
    prevBtn.addEventListener('click', () => flip('backward'));
    nextBtn.addEventListener('click', () => flip('forward'));
    jumpBtn.addEventListener('click', () => jumpToPage(jumpInput, jumpError));
    jumpInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') jumpToPage(jumpInput, jumpError); });

    lsPrevBtn.addEventListener('click', () => { showControls(); flip('backward'); });
    lsNextBtn.addEventListener('click', () => { showControls(); flip('forward');  });

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === jumpInput) return;
      if (e.key === 'ArrowRight') flip('forward');
      if (e.key === 'ArrowLeft')  flip('backward');
    });

    window.addEventListener('resize', applyLayout);
    window.addEventListener('orientationchange', () => setTimeout(applyLayout, 150));
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', applyLayout);
    }

    renderStatic(0);
    applyLayout();
  </script>
</body>
</html>
